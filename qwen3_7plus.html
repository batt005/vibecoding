<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — Полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg2: #1b1b32;
    --bg3: #2a2a40;
    --text: #dfdfe2;
    --muted: #858591;
    --accent: #f1be32;
    --accent2: #acacac;
    --green: #acd157;
    --red: #e74c3c;
    --blue: #3b82f6;
    --border: #3b3b4f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow: hidden;
    height: 100vh;
  }
  header {
    background: var(--bg2);
    border-bottom: 2px solid var(--accent);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    font-weight: bold;
    font-size: 20px;
  }
  .progress-bar {
    flex: 1;
    max-width: 400px;
    margin: 0 20px;
    background: var(--bg3);
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--accent);
    height: 100%;
    width: 0%;
    transition: width 0.3s;
  }
  .progress-text {
    color: var(--muted);
    font-size: 14px;
  }
  .container {
    display: flex;
    height: calc(100vh - 60px);
  }
  aside {
    width: 280px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 15px 0;
  }
  aside h3 {
    padding: 10px 20px;
    color: var(--accent);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .lesson-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s;
  }
  .lesson-item:hover { background: var(--bg3); }
  .lesson-item.active {
    background: var(--bg3);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .lesson-item.completed::before {
    content: "✓";
    color: var(--green);
    font-weight: bold;
  }
  .lesson-item:not(.completed)::before {
    content: "○";
    color: var(--muted);
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 30px 40px;
  }
  .lesson-title {
    color: var(--accent);
    font-size: 28px;
    margin-bottom: 10px;
  }
  .lesson-subtitle {
    color: var(--muted);
    margin-bottom: 25px;
    font-size: 14px;
  }
  .lesson-content {
    max-width: 800px;
    font-size: 16px;
    line-height: 1.8;
  }
  .lesson-content h2 {
    color: var(--accent);
    margin: 25px 0 15px;
    font-size: 22px;
  }
  .lesson-content h3 {
    color: var(--text);
    margin: 20px 0 10px;
    font-size: 18px;
  }
  .lesson-content p { margin-bottom: 15px; }
  .lesson-content code {
    background: var(--bg3);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--green);
    font-family: "Courier New", monospace;
    font-size: 14px;
  }
  .lesson-content pre {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 15px;
    margin: 15px 0;
    overflow-x: auto;
    font-family: "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .lesson-content pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .lesson-content ul, .lesson-content ol {
    margin: 10px 0 15px 25px;
  }
  .lesson-content li { margin-bottom: 5px; }
  .task-box {
    background: var(--bg2);
    border-left: 4px solid var(--accent);
    padding: 15px 20px;
    margin: 20px 0;
    border-radius: 5px;
  }
  .task-box h4 {
    color: var(--accent);
    margin-bottom: 10px;
  }
  .task-box ul { list-style: none; margin-left: 0; }
  .task-box li {
    padding: 5px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .task-box li::before {
    content: "▸";
    color: var(--accent);
  }
  .editor-section {
    margin-top: 30px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
  }
  .editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .editor-header h3 {
    color: var(--accent);
    font-size: 18px;
  }
  .editor-buttons { display: flex; gap: 10px; }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  button:hover { background: #f5c842; transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--border); }
  #codeEditor {
    width: 100%;
    min-height: 200px;
    background: var(--bg2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 15px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  #codeEditor:focus { border-color: var(--accent); }
  .output-section {
    margin-top: 15px;
  }
  .output-header {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #output {
    background: #000;
    color: var(--green);
    padding: 15px;
    border-radius: 5px;
    min-height: 80px;
    font-family: "Courier New", monospace;
    font-size: 13px;
    white-space: pre-wrap;
    border: 1px solid var(--border);
  }
  #output.error { color: var(--red); }
  .test-results {
    margin-top: 15px;
  }
  .test-item {
    padding: 8px 12px;
    margin: 5px 0;
    border-radius: 4px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .test-item.pass {
    background: rgba(172, 209, 87, 0.1);
    border-left: 3px solid var(--green);
    color: var(--green);
  }
  .test-item.fail {
    background: rgba(231, 76, 60, 0.1);
    border-left: 3px solid var(--red);
    color: var(--red);
  }
  .loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--bg3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    margin-top: 20px;
    color: var(--accent);
    font-size: 18px;
  }
  .success-banner {
    background: rgba(172, 209, 87, 0.15);
    border: 2px solid var(--green);
    padding: 20px;
    border-radius: 8px;
    margin-top: 20px;
    text-align: center;
  }
  .success-banner h3 {
    color: var(--green);
    margin-bottom: 10px;
  }
  .hint-box {
    background: rgba(59, 130, 246, 0.1);
    border-left: 3px solid var(--blue);
    padding: 12px 15px;
    margin: 15px 0;
    border-radius: 4px;
    font-size: 14px;
  }
  .hint-box strong { color: var(--blue); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  @media (max-width: 768px) {
    aside { width: 220px; }
    main { padding: 20px; }
    .progress-bar { display: none; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем Python... (это может занять 10-30 секунд)</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">Py</div>
    <span>PythonCamp</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 уроков</div>
</header>

<div class="container">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
// ============ ДАННЫЕ КУРСА ============
const lessons = [
  {
    id: 1,
    title: "Привет, Python!",
    subtitle: "Урок 1 · Введение",
    content: `
      <h2>Добро пожаловать в мир Python!</h2>
      <p>Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
      <p>Python славится своим простым и читаемым синтаксисом, что делает его идеальным для начинающих.</p>
      <h3>Ваша первая программа</h3>
      <p>Традиционно изучение любого языка начинается с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст на экран. Текст, заключённый в кавычки, называется <strong>строкой</strong>.</p>
      <div class="hint-box"><strong>💡 Подсказка:</strong> Строки можно заключать как в двойные <code>"..."</code>, так и в одинарные <code>'...'</code> кавычки.</div>
      <div class="task-box">
        <h4>📝 Задание</h4>
        <ul>
          <li>Выведите на экран фразу <code>Hello, World!</code></li>
          <li>Выведите на экран своё имя (например, <code>Меня зовут Анна</code>)</li>
        </ul>
      </div>
    `,
    starter: `# Напишите свою первую программу\nprint("Hello, World!")\n`,
    tests: [
      { desc: "Вывод содержит 'Hello, World!'", check: (out) => out.includes("Hello, World!") },
      { desc: "Вывод содержит ещё одну строку (ваше имя или сообщение)", check: (out) => out.split("\n").filter(l => l.trim()).length >= 2 }
    ]
  },
  {
    id: 2,
    title: "Переменные",
    subtitle: "Урок 2 · Основы",
    content: `
      <h2>Переменные — контейнеры для данных</h2>
      <p>Переменная — это именованная ячейка памяти, в которой хранятся данные. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True</code></pre>
      <h3>Правила именования переменных</h3>
      <ul>
        <li>Имя может содержать буквы, цифры и символ подчёркивания <code>_</code></li>
        <li>Имя не может начинаться с цифры</li>
        <li>Имена регистрозависимы: <code>Age</code> и <code>age</code> — разные переменные</li>
        <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и др.)</li>
      </ul>
      <h3>Вывод переменных</h3>
      <pre><code>name = "Боб"
print("Привет,", name)
print(f"Тебе {25} лет")  # f-строки</code></pre>
      <div class="task-box">
        <h4>📝 Задание</h4>
        <ul>
          <li>Создайте переменную <code>language</code> со значением <code>"Python"</code></li>
          <li>Создайте переменную <code>year</code> со значением <code>1991</code></li>
          <li>Выведите: <code>Python создан в 1991 году</code> (используя переменные)</li>
        </ul>
      </div>
    `,
    starter: `# Создайте переменные\nlanguage = "Python"\nyear = 1991\n\n# Выведите результат\n`,
    tests: [
      { desc: "Существует переменная language", check: (out, code) => /language\s*=\s*["']Python["']/.test(code) },
      { desc: "Существует переменная year со значением 1991", check: (out, code) => /year\s*=\s*1991/.test(code) },
      { desc: "Вывод содержит 'Python создан в 1991 году'", check: (out) => out.includes("Python создан в 1991 году") || out.includes("Python создан в  1991 году") }
    ]
  },
  {
    id: 3,
    title: "Типы данных",
    subtitle: "Урок 3 · Основы",
    content: `
      <h2>Основные типы данных в Python</h2>
      <p>Python имеет несколько встроенных типов данных:</p>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"Привет"</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
        <li><code>NoneType</code> — специальное значение <code>None</code> (отсутствие значения)</li>
      </ul>
      <h3>Функция type()</h3>
      <p>Чтобы узнать тип переменной, используйте <code>type()</code>:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = 3.14
print(type(y))  # &lt;class 'float'&gt;</code></pre>
      <h3>Преобразование типов</h3>
      <pre><code>age = "25"
age_int = int(age)    # строка → число
price = float("9.99") # строка → дробное число
text = str(100)       # число → строка</code></pre>
      <div class="task-box">
        <h4>📝 Задание</h4>
        <ul>
          <li>Создайте переменную <code>pi</code> = 3.14159</li>
          <li>Создайте переменную <code>count</code> = 100</li>
          <li>Выведите тип переменной <code>pi</code> (должно быть <code>&lt;class 'float'&gt;</code>)</li>
          <li>Преобразуйте <code>count</code> в строку и выведите результат</li>
        </ul>
      </div>
    `,
    starter: `pi = 3.14159\ncount = 100\n\n# Выведите тип pi\n\n# Преобразуйте count в строку и выведите\n`,
    tests: [
      { desc: "Вывод содержит '<class 'float'>'", check: (out) => out.includes("<class 'float'>") },
      { desc: "Вывод содержит строку '100'", check: (out) => out.includes("100") },
      { desc: "Использована функция str()", check: (out, code) => /str\s*\(\s*count\s*\)/.test(code) }
    ]
  },
  {
    id: 4,
    title: "Арифметические операции",
    subtitle: "Урок 4 · Операторы",
    content: `
      <h2>Математика в Python</h2>
      <p>Python — отличный калькулятор. Поддерживаются все стандартные операции:</p>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание
print(a * b)   # 30  — умножение
print(a / b)   # 3.333... — деление
print(a // b)  # 3   — целочисленное деление
print(a % b)   # 1   — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>
      <h3>Приоритет операций</h3>
      <p>Как в математике: сначала скобки, потом степени, умножение/деление, сложение/вычитание.</p>
      <pre><code>result = 2 + 3 * 4    # 14
result = (2 + 3) * 4  # 20</code></pre>
      <div class="hint-box"><strong>💡 Подсказка:</strong> Оператор <code>%</code> (остаток) очень полезен для проверки чётности: <code>n % 2 == 0</code> означает, что число чётное.</div>
      <div class="task-box">
        <h4>📝 Задание</h4>
        <ul>
          <li>Вычислите и выведите: площадь круга радиусом 5 (формула: π·r², π ≈ 3.14159)</li>
          <li>Вычислите и выведите остаток от деления 17 на 5</li>
          <li>Вычислите и выведите 2 в степени 10</li>
        </ul>
      </div>
    `,
    starter: `# Площадь круга радиусом 5\nr = 5\npi = 3.14159\n\n# Выведите площадь\n\n# Остаток от деления 17 на 5\n\n# 2 в степени 10\n`,
    tests: [
      { desc: "Площадь круга ≈ 78.54", check: (out) => /78\.5[34]/.test(out) },
      { desc: "Остаток от деления 17 на 5 равен 2", check: (out) => out.includes("2") && /17\s*%\s*5/.test(out.replace(/\s/g,"")) || out.split("\n").some(l => l.trim() === "2") },
      { desc: "2 в степени 10 равно 1024", check: (out) => out.includes("1024") }
    ]
  },
  {
    id: 5,
    title: "Ввод данных",
    subtitle: "Урок 5 · Взаимодействие",
    content: `
      <h2>Функция input()</h2>
      <p>Чтобы получить данные от пользователя, используйте <code>input()</code>:</p>
      <pre><code>name = input("Как тебя зовут? ")
print("Привет,", name)</code></pre>
      <p><strong>Важно:</strong> <code>input()</code> всегда возвращает строку! Если нужно число, преобразуйте его:</p>
      <pre><code>age = int(input("Сколько тебе лет? "))
print("Через год тебе будет", age + 1)</code></pre>
      <div class="hint-box"><strong>⚠️ Примечание:</strong> В нашем онлайн-редакторе функция <code>input()</code> имитируется — она возвращает заранее подготовленные тестовые данные. Для реального взаимодействия с пользователем используйте локальный Python.</div>
      <div class="task-box">
        <h4>📝 Задание</h4>
        <ul>
          <li>Создайте переменную <code>name</code> со значением <code>"Мария"</code> (имитация ввода)</li>
          <li>Создайте переменную <code>age</code> со значением <code>20</code></li>
          <li>Выведите: <code>Мария, тебе 20 лет</code></li>
        </ul>
      </div>
    `,
    starter: `# Имитация ввода данных\nname = "Мария"\nage = 20\n\n# Выведите приветствие\n`,
    tests: [
      { desc: "Вывод содержит 'Мария, тебе 20 лет'", check: (out) => out.includes("Мария, тебе 20 лет") || out.includes("Мария , тебе 20 лет") }
    ]
  },
  {
    id: 6,
    title: "Условные операторы",
    subtitle: "Урок 6 · Ветвление",
    content: `
      <h2>if / elif / else</h2>
      <p>Условные операторы позволяют выполнять разный код в зависимости от условий:</p>
      <pre><code>age = 18

if age >= 18:
    print("Вы совершеннолетний")
elif age >= 14:
    print("Вы подросток")
else:
    print("Вы ребёнок")</code></pre>
      <h3>Операторы сравнения</h3>
      <ul>
        <li><code>==</code> — равно</li>
        <li><code>!=</code> — не равно</li>
        <li><code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code> — сравнения</li>
      </ul>
      <h3>Логические операторы</h3>
      <pre><code>x = 15
if x > 10 and x < 20:
    print("x между 10 и 20")

if x == 5 or x == 15:
    print("x равен 5 или 15")

if not x == 0:
    print("x не равен нулю")</code></pre>
      <div class="task-box">
        <h4>📝 Задание</h4>

// ============ СОСТОЯНИЕ ============
let pyodide = null;
let currentLessonId = 1;
let completedLessons = JSON.parse(localStorage.getItem('completedLessons') || '[]');
let userCode = {};

// Загрузка сохранённого кода
try {
  userCode = JSON.parse(localStorage.getItem('userCode') || '{}');
} catch(e) { userCode = {}; }

// ============ ИНИЦИАЛИЗАЦИЯ PYODIDE ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
    });
    document.getElementById('loading').style.display = 'none';
    renderSidebar();
    loadLesson(1);
    updateProgress();
  } catch(e) {
    document.getElementById('loading').innerHTML = 
      `<div style="color: #e74c3c; text-align: center; padding: 20px;">
        <h2>Ошибка загрузки Python</h2>
        <p>${e.message}</p>
        <p>Проверьте интернет-соединение и обновите страницу.</p>
      </div>`;
  }
}

// ============ РЕНДЕРИНГ БОКОВОЙ ПАНЕЛИ ============
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h3>📚 Курс Python</h3>';
  lessons.forEach(lesson => {
    const item = document.createElement('div');
    item.className = 'lesson-item';
    if (lesson.id === currentLessonId) item.classList.add('active');
    if (completedLessons.includes(lesson.id)) item.classList.add('completed');
    item.textContent = lesson.title;
    item.onclick = () => loadLesson(lesson.id);
    sidebar.appendChild(item);
  });
}

// ============ ЗАГРУЗКА УРОКА ============
function loadLesson(id) {
  currentLessonId = id;
  const lesson = lessons.find(l => l.id === id);
  const main = document.getElementById('main');
  const savedCode = userCode[id] !== undefined ? userCode[id] : lesson.starter;
  
  main.innerHTML = `
    <h1 class="lesson-title">${lesson.title}</h1>
    <div class="lesson-subtitle">${lesson.subtitle}</div>
    <div class="lesson-content">${lesson.content}</div>
    <div class="editor-section">
      <div class="editor-header">
        <h3>💻 Редактор кода</h3>
        <div class="editor-buttons">
          <button class="secondary" onclick="resetCode()">↺ Сбросить</button>
          <button class="secondary" onclick="runCode()">▶ Запустить</button>
          <button onclick="checkCode()">✓ Проверить</button>
        </div>
      </div>
      <textarea id="codeEditor" spellcheck="false">${escapeHtml(savedCode)}</textarea>
      <div class="output-section">
        <div class="output-header">Вывод программы</div>
        <div id="output">Нажмите "Запустить" для выполнения кода</div>
      </div>
      <div class="test-results" id="testResults"></div>
    </div>
  `;
  
  renderSidebar();
  main.scrollTop = 0;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============ СОХРАНЕНИЕ КОДА ============
document.addEventListener('input', (e) => {
  if (e.target.id === 'codeEditor') {
    userCode[currentLessonId] = e.target.value;
    localStorage.setItem('userCode', JSON.stringify(userCode));
  }
});

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode() {
  const code = document.getElementById('codeEditor').value;
  const output = document.getElementById('output');
  output.className = '';
  output.textContent = '⏳ Выполняется...';
  
  try {
    // Перехватываем stdout
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    
    // Имитация input() — возвращаем тестовые данные
    pyodide.runPython(`
_input_queue = []
def fake_input(prompt=""):
    if _input_queue:
        return _input_queue.pop(0)
    return ""
import builtins
builtins.input = fake_input
`);
    
    await pyodide.runPythonAsync(code);
    
    const result = pyodide.runPython('sys.stdout.getvalue()');
    const errors = pyodide.runPython('sys.stderr.getvalue()');
    
    if (errors) {
      output.className = 'error';
      output.textContent = errors;
    } else {
      output.textContent = result || '(программа выполнена без вывода)';
    }
  } catch(e) {
    output.className = 'error';
    output.textContent = '❌ Ошибка:\n' + e.message;
  }
}

// ============ ПРОВЕРКА КОДА ============
async function checkCode() {
  const code = document.getElementById('codeEditor').value;
  const lesson = lessons.find(l => l.id === currentLessonId);
  const output = document.getElementById('output');
  const testResults = document.getElementById('testResults');
  
  output.className = '';
  output.textContent = '⏳ Проверяем...';
  testResults.innerHTML = '';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);
    
    await pyodide.runPythonAsync(code);
    
    const result = pyodide.runPython('sys.stdout.getvalue()');
    const errors = pyodide.runPython('sys.stderr.getvalue()');
    
    if (errors) {
      output.className = 'error';
      output.textContent = errors;
    } else {
      output.textContent = result || '(нет вывода)';
    }
    
    // Проверяем тесты
    let passed = 0;
    lesson.tests.forEach(test => {
      const ok = test.check(result, code);
      const div = document.createElement('div');
      div.className = 'test-item ' + (ok ? 'pass' : 'fail');
      div.innerHTML = `${ok ? '✓' : '✗'} ${test.desc}`;
      testResults.appendChild(div);
      if (ok) passed++;
    });
    
    if (passed === lesson.tests.length) {
      // Все тесты пройдены
      if (!completedLessons.includes(currentLessonId)) {
        completedLessons.push(currentLessonId);
        localStorage.setItem('completedLessons', JSON.stringify(completedLessons));
      }
      const banner = document.createElement('div');
      banner.className = 'success-banner';
      banner.innerHTML = `
        <h3>🎉 Поздравляем!</h3>
        <p>Вы прошли урок "${lesson.title}"!</p>
        ${currentLessonId < lessons.length ? 
          `<button onclick="loadLesson(${currentLessonId + 1})" style="margin-top: 15px;">Следующий урок →</button>` :
          `<p style="margin-top: 10px; color: var(--green); font-weight: bold;">Вы завершили весь курс! 🏆</p>`}
      `;
      testResults.appendChild(banner);
      renderSidebar();
      updateProgress();
    }
  } catch(e) {
    output.className = 'error';
    output.textContent = '❌ Ошибка:\n' + e.message;
  }
}

// ============ СБРОС КОДА ============
function resetCode() {
  const lesson = lessons.find(l => l.id === currentLessonId);
  document.getElementById('codeEditor').value = lesson.starter;
  userCode[currentLessonId] = lesson.starter;
  localStorage.setItem('userCode', JSON.stringify(userCode));
  document.getElementById('output').textContent = 'Код сброшен';
  document.getElementById('output').className = '';
  document.getElementById('testResults').innerHTML = '';
}

// ============ ПРОГРЕСС ============
function updateProgress() {
  const pct = (completedLessons.length / lessons.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = 
    `${completedLessons.length} / ${lessons.length} уроков`;
}

// ============ СТАРТ ============
initPyodide();
</script>
